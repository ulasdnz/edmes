packages:
  - packages/*
  - apps/*
  - user
  - work-center
  - production
  - realtime
  - telemetry
  - performance
  - e2e

ignoredBuiltDependencies:
  - '@scarf/scarf'

onlyBuiltDependencies:
  - cpu-features
  - esbuild
  - msgpackr-extract
  - protobufjs
  - ssh2

# Lets `pnpm deploy` build each service image from pnpm-lock.yaml. Workspace packages stay
# symlinked while their peers resolve alike in every project; a `file:` workspace entry in the
# lockfile means one was copied, and its local changes then need `pnpm install`.
injectWorkspacePackages: true

# A version becomes installable a week after its release (minutes), time for a compromised one to
# be caught; the same wait Dependabot applies. An urgent fix goes in minimumReleaseAgeExclude.
minimumReleaseAge: 10080
