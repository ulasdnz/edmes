name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the checks still running for it. Every other run has a
# group of its own, so each commit on main keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs, since a tag can be moved to other code; Dependabot keeps the
# pins current. The tests start MongoDB, Redis and MQTT through Testcontainers on the runner's
# Docker.
jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # the major of the Node image the Dockerfiles pin
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Errors only: printed among hundreds of warnings, some errors went missing from the output
      - run: pnpm exec biome ci --diagnostic-level=error .
      - run: pnpm typecheck
      # The emit imports the shared packages' dist, which typecheck has just built
      - run: pnpm openapi:emit && pnpm --filter @mes/api-client generate && git diff --exit-code packages/api-client && test -z "$(git ls-files --others --exclude-standard packages/api-client)"

  audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Reads pnpm-lock.yaml only, so nothing is installed. Fails on any advisory against a package
      # the service images ship; an accepted one goes in auditConfig in pnpm-workspace.yaml.
      - run: pnpm audit --prod

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The frontend browser tests run in Chromium
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  contract:
    name: Contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Under the job's limit: a hung run fails this step instead of cancelling the job, which
      # would skip the upload
      - run: pnpm test:e2e
        timeout-minutes: 15
      # The services' logs from every run, green ones too, so a failure can be read against a
      # passing baseline
      - name: Upload service logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-service-logs
          path: e2e/logs/
          retention-days: 14

  ui-e2e:
    name: UI end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The stack refuses to start without its secrets; the specs read the admin's from this file
      - name: Create .env with generated secrets
        run: |
          cp .env.example .env
          for key in JWT_SECRET INTERNAL_API_TOKEN GRAFANA_PASSWORD MQTT_PASSWORD MQTT_HEALTH_PASSWORD; do
            sed -i "s/^$key=.*/$key=$(openssl rand -hex 32)/" .env
          done
          # Within the password policy's 20 characters
          sed -i "s/^SYSTEM_ADMIN_PASSWORD=.*/SYSTEM_ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)/" .env
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the images, starts the stack and runs the specs in Chromium. Under the job's limit:
      # a hung run fails this step instead of cancelling the job, which would skip the uploads
      - run: pnpm test:ui-e2e
        timeout-minutes: 15
      - name: Upload service logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-service-logs
          path: apps/ui-e2e/logs/
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-playwright-report
          path: apps/ui-e2e/playwright-report/
          retention-days: 14
