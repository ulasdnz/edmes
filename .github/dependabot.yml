version: 2
updates:
  # Moves the commit SHAs the workflows pin their actions to, all in one pull request a month
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release becomes a candidate only after a week, time for a compromised one to be caught
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # Moves the Node image the six service Dockerfiles pin, tag and digest, in one pull request a month
  - package-ecosystem: docker
    directories:
      - /user
      - /work-center
      - /production
      - /performance
      - /telemetry
      - /realtime
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # A new major is a migration (Node 27, MongoDB 8, Traefik 3...), done by hand, not merged
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      base-images:
        patterns: ['*']

  # Moves the infrastructure images docker-compose.yml pins, in one pull request a month
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The six service images are this project's own, versioned by its releases
      - dependency-name: 'ghcr.io/ulasdnz/edmes-*'
    groups:
      infrastructure:
        patterns: ['*']
