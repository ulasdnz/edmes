# Serves the web app at / and the operator panel at /operator/. The gateway sends it every path no
# service router names, so the API prefixes below must never answer with the SPA's HTML.
server {
  listen 8080;
  root /usr/share/nginx/html;
  # Behind the gateway nginx does not know the public host or port, so redirects stay relative
  absolute_redirect off;

  # An add_header inside a location replaces the ones set at server level, so every location
  # that sets its own includes this file again
  include /etc/nginx/edmes/security-headers.conf;

  location = /healthz {
    include /etc/nginx/edmes/security-headers.conf;
    default_type text/plain;
    return 200 'ok';
  }

  location ~ ^/(api|internal|socket\.io|docs|uploads)(/|$) {
    include /etc/nginx/edmes/security-headers.conf;
    return 404;
  }

  location = /operator {
    include /etc/nginx/edmes/security-headers.conf;
    return 301 /operator/;
  }

  # Built files carry a content hash in their name
  location ~ ^(/operator)?/assets/ {
    include /etc/nginx/edmes/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^(/operator)?/(index\.html|version\.json)$ {
    include /etc/nginx/edmes/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location /operator/ {
    try_files $uri /operator/index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
