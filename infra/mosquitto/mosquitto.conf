listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/password_file
persistence true
persistence_location /mosquitto/data/
# A client that is away, such as telemetry during an outage, keeps its QoS 1 messages up to a byte
# ceiling instead of 1000 messages. 64 MiB is provisional until the broker capacity is measured.
max_queued_messages 0
max_queued_bytes 67108864
log_dest stdout
log_type all
connection_messages true
