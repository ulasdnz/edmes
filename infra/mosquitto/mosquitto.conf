listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/password_file
persistence true
persistence_location /mosquitto/data/
# A crash loses what arrived since the last save; a save of the full queue took 0.88 s
autosave_interval 60
# A client that is away, such as telemetry during an outage, keeps its QoS 1 messages up to a byte
# ceiling instead of 1000 messages: the payload bytes a measured 30-minute outage at the design load
# queued, plus 25%. docs/operations/mqtt-broker-capacity.md has the measurement.
max_queued_messages 0
max_queued_bytes 166219160
log_dest stdout
# Errors, warnings, notices (connects, disconnects and dropped messages) and information. `all`
# adds the debug type, which logs every PUBLISH and PUBACK: 2,000 lines a second at the design load
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
