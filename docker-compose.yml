services:
  traefik:
    image: traefik:v2.11
    container_name: api_gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "8080:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=mes_network"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - mes_network
    labels:
      - "traefik.enable=true"
      # Genel güvenlik header'ları (HSTS yok, HTTPS yok)
      - "traefik.http.middlewares.global-compress.compress=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      # Rate limit - per IP, genel API
      - "traefik.http.middlewares.rate-limit.ratelimit.average=200"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1s"
      # Rate limit - per IP, auth flooding koruması
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=30"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=10"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.period=1s"
      # Request body limit - 25MB
      - "traefik.http.middlewares.body-limit.buffering.maxRequestBodyBytes=26214400"

  mongodb:
    image: mongo:7
    container_name: mongodb_dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: redis_dev
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy noeviction --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_dev
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/password_file:/mosquitto/config/password_file:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-u", "health", "-P", "dev123", "-t", "_healthcheck", "-m", "ok", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: user_app
    restart: unless-stopped
    # Port dışarıya açılmıyor, sadece Traefik üzerinden erişilir
    volumes:
      - user_uploads:/app/uploads
    env_file:
      - ./user/.env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/mes?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - SYSTEM_ADMIN_BOOTSTRAP_ENABLED=${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:-true}
      - SYSTEM_ADMIN_EMAIL=${SYSTEM_ADMIN_EMAIL:-system.admin@example.local}
      - SYSTEM_ADMIN_PASSWORD=${SYSTEM_ADMIN_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      # Catch-all router - /api/v1 ve /docs (düşük priority, yeni servisler üstüne biner)
      # /internal/v1 intentionally excluded - gateway seviyesinde erişilemiyor
      - "traefik.http.routers.user.rule=PathPrefix(`/api/v1`) || PathPrefix(`/docs`)"
      - "traefik.http.routers.user.entrypoints=web"
      - "traefik.http.routers.user.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.user.priority=1"
      - "traefik.http.services.user.loadbalancer.server.port=3000"
      # Auth router - flooding koruması, önce eşleşsin diye priority yüksek
      - "traefik.http.routers.user-auth.rule=PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.user-auth.entrypoints=web"
      - "traefik.http.routers.user-auth.middlewares=global-compress@docker,secure-headers@docker,auth-rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.user-auth.priority=10"
      - "traefik.http.routers.user-auth.service=user"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  telemetry:
    build:
      context: .
      dockerfile: telemetry/Dockerfile
    container_name: telemetry_app
    restart: unless-stopped
    env_file:
      - ./telemetry/.env
    environment:
      - MONGO_URI=${MONGO_URI_TELEMETRY:-mongodb://mongodb:27017/mes_telemetry?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - INTERNAL_API_PRODUCTION=${INTERNAL_API_PRODUCTION:-http://production:3002}
      - PLANT_TIMEZONE=${PLANT_TIMEZONE:-Europe/Istanbul}
      - MQTT_URL=${MQTT_URL:-mqtt://mosquitto:1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-mes_service}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-dev123}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.telemetry.rule=PathPrefix(`/api/v1/tags`) || PathPrefix(`/api/v1/tag-types`) || PathPrefix(`/api/v1/edge-devices`) || PathPrefix(`/api/v1/historian`) || PathPrefix(`/api/v1/discovery`)"
      - "traefik.http.routers.telemetry.entrypoints=web"
      - "traefik.http.routers.telemetry.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.telemetry.priority=20"
      - "traefik.http.services.telemetry.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  work-center:
    build:
      context: .
      dockerfile: work-center/Dockerfile
    container_name: work_center_app
    restart: unless-stopped
    env_file:
      - ./work-center/.env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/mes?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      # Work center routes — priority > 1 so they match before user-service catch-all
      - "traefik.http.routers.work-center.rule=PathPrefix(`/api/v1/work-centers`) || PathPrefix(`/api/v1/shifts`)"
      - "traefik.http.routers.work-center.entrypoints=web"
      - "traefik.http.routers.work-center.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.work-center.priority=5"
      - "traefik.http.services.work-center.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  production:
    build:
      context: .
      dockerfile: production/Dockerfile
    container_name: production_app
    restart: unless-stopped
    env_file:
      - ./production/.env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/mes?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - INTERNAL_API_WORK_CENTER=${INTERNAL_API_WORK_CENTER:-http://work-center:3001}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.production-uoms.rule=PathPrefix(`/api/v1/uoms`)"
      - "traefik.http.routers.production-uoms.entrypoints=web"
      - "traefik.http.routers.production-uoms.priority=5"
      - "traefik.http.routers.production-uoms.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-uoms.service=production"
      - "traefik.http.routers.production-categories.rule=PathPrefix(`/api/v1/product-categories`)"
      - "traefik.http.routers.production-categories.entrypoints=web"
      - "traefik.http.routers.production-categories.priority=5"
      - "traefik.http.routers.production-categories.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-categories.service=production"
      - "traefik.http.routers.production-products.rule=PathPrefix(`/api/v1/products`)"
      - "traefik.http.routers.production-products.entrypoints=web"
      - "traefik.http.routers.production-products.priority=5"
      - "traefik.http.routers.production-products.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-products.service=production"
      - "traefik.http.routers.production-standards.rule=PathPrefix(`/api/v1/product-standards`)"
      - "traefik.http.routers.production-standards.entrypoints=web"
      - "traefik.http.routers.production-standards.priority=5"
      - "traefik.http.routers.production-standards.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-standards.service=production"
      - "traefik.http.routers.production-plans.rule=PathPrefix(`/api/v1/production-plans`)"
      - "traefik.http.routers.production-plans.entrypoints=web"
      - "traefik.http.routers.production-plans.priority=5"
      - "traefik.http.routers.production-plans.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-plans.service=production"
      - "traefik.http.routers.production-jobs.rule=PathPrefix(`/api/v1/job-orders`)"
      - "traefik.http.routers.production-jobs.entrypoints=web"
      - "traefik.http.routers.production-jobs.priority=5"
      - "traefik.http.routers.production-jobs.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-jobs.service=production"
      - "traefik.http.routers.production-adjustments.rule=PathPrefix(`/api/v1/quantity-adjustments`)"
      - "traefik.http.routers.production-adjustments.entrypoints=web"
      - "traefik.http.routers.production-adjustments.priority=5"
      - "traefik.http.routers.production-adjustments.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-adjustments.service=production"
      - "traefik.http.routers.production-scrap.rule=PathPrefix(`/api/v1/scrap-entries`)"
      - "traefik.http.routers.production-scrap.entrypoints=web"
      - "traefik.http.routers.production-scrap.priority=5"
      - "traefik.http.routers.production-scrap.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.production-scrap.service=production"
      - "traefik.http.services.production.loadbalancer.server.port=3002"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  performance:
    build:
      context: .
      dockerfile: performance/Dockerfile
    container_name: performance_app
    restart: unless-stopped
    env_file:
      - ./performance/.env
    environment:
      - MONGO_URI=${MONGO_URI_PERFORMANCE:-mongodb://mongodb:27017/mes_performance?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - INTERNAL_API_WORK_CENTER=${INTERNAL_API_WORK_CENTER:-http://work-center:3001}
      - INTERNAL_API_PRODUCTION=${INTERNAL_API_PRODUCTION:-http://production:3002}
      - INTERNAL_API_TELEMETRY=${INTERNAL_API_TELEMETRY:-http://telemetry:3001}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.performance.rule=PathPrefix(`/api/v1/oee`) || PathPrefix(`/api/v1/reasons`) || PathPrefix(`/api/v1/planned-stops`) || PathPrefix(`/api/v1/planned-stop-templates`) || PathPrefix(`/api/v1/planned-stop-schedules`) || PathPrefix(`/api/v1/unplanned-stops`)"
      - "traefik.http.routers.performance.entrypoints=web"
      - "traefik.http.routers.performance.priority=5"
      - "traefik.http.routers.performance.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.services.performance.loadbalancer.server.port=3004"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    container_name: realtime_app
    restart: unless-stopped
    env_file:
      - ./realtime/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.realtime.rule=PathPrefix(`/socket.io`)"
      - "traefik.http.routers.realtime.entrypoints=web"
      - "traefik.http.routers.realtime.priority=10"
      - "traefik.http.services.realtime.loadbalancer.server.port=3003"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  loki:
    image: grafana/loki:3.4.1
    container_name: loki
    restart: unless-stopped
    command: --config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - mes_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 300M

  promtail:
    image: grafana/promtail:3.4.1
    container_name: promtail
    restart: unless-stopped
    command: --config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/positions
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  mes_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  user_uploads:
  loki_data:
  grafana_data:
  promtail_positions:
  mosquitto_data:
