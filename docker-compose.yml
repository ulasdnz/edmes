# The project name keeps the volume names the same wherever these files are unpacked
name: aimes

# The six service images are published by the release workflow as
# ghcr.io/ulasdnz/aimes-<service>:<version>, and install.sh sets AIMES_VERSION from the release
# VERSION file. In a source checkout docker-compose.override.yml builds them instead, as :dev.

# Every image is pinned by exact tag and digest, so each start runs the same one; Dependabot
# (docker-compose) proposes newer patches and minors, majors are upgraded by hand

# Every container keeps at most 5 log files of 20 MB, the older ones compressed; Loki keeps the
# history. Docker Engine's default json-file driver never rotates them.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: '5'

services:
  traefik:
    image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    container_name: api_gateway
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080" # dashboard: localhost only
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=mes_network"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - mes_network
    labels:
      - "traefik.enable=true"
      # Genel güvenlik header'ları (HSTS yok, HTTPS yok)
      - "traefik.http.middlewares.global-compress.compress=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      # Rate limit - per IP, genel API
      - "traefik.http.middlewares.rate-limit.ratelimit.average=200"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1s"
      # Rate limit - per IP, auth flooding koruması
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=30"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=10"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.period=1s"
      # Request body limit - 25MB
      - "traefik.http.middlewares.body-limit.buffering.maxRequestBodyBytes=26214400"

  mongodb:
    image: mongo:9.0.2@sha256:f5c6240ae8fccc21cf75acc6462929b3394a7a5a7abd934b6b0e7ada5eb5fe95
    container_name: mongodb_dev
    restart: unless-stopped
    logging: *logging
    ports:
      - '127.0.0.1:27017:27017' # localhost only; services use mes_network
    volumes:
      - mongodb_data:/data/db
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: redis_dev
    restart: unless-stopped
    logging: *logging
    command: redis-server --maxmemory 1gb --maxmemory-policy noeviction --appendonly yes
    ports:
      - '127.0.0.1:6379:6379' # localhost only; services use mes_network
    volumes:
      - redis_data:/data
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    container_name: mosquitto_dev
    restart: unless-stopped
    logging: *logging
    ports:
      - "1883:1883"
    # The password file is written from these at every start (infra/mosquitto/init-passwords.sh)
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-mes_service}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be set}
      - MQTT_HEALTH_PASSWORD=${MQTT_HEALTH_PASSWORD:?MQTT_HEALTH_PASSWORD must be set}
    entrypoint: ["/bin/sh", "/mosquitto/init-passwords.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/init-passwords.sh:/mosquitto/init-passwords.sh:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - mes_network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -u health -P \"$$MQTT_HEALTH_PASSWORD\" -t _healthcheck -m ok -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # CPU: the limit the measured 30-minute outage ran under (its peak was 0.361 cores). Memory:
    # computed for a queue at the ceiling from the measured cost per message, 691.5 B x 1,127,301
    # x 1.25. See docs/operations/mqtt-broker-capacity.md
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 960M

  user:
    image: ghcr.io/ulasdnz/aimes-user:${AIMES_VERSION:-dev}
    container_name: user_app
    restart: unless-stopped
    logging: *logging
    # Port dışarıya açılmıyor, sadece Traefik üzerinden erişilir
    volumes:
      - user_uploads:/app/uploads
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/mes?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - PLANT_TIMEZONE=${PLANT_TIMEZONE:-Europe/Istanbul}
      - SYSTEM_ADMIN_BOOTSTRAP_ENABLED=${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:-true}
      - SYSTEM_ADMIN_EMAIL=${SYSTEM_ADMIN_EMAIL:-system.admin@example.local}
      - SYSTEM_ADMIN_PASSWORD=${SYSTEM_ADMIN_PASSWORD:-}
      - SYSTEM_ADMIN_MUST_CHANGE_PASSWORD=${SYSTEM_ADMIN_MUST_CHANGE_PASSWORD:-false}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      # Every service names its own public resources, so a path no router names gets the gateway's
      # 404 instead of reaching a service that does not own it. /internal/v1 is never routed.
      - "traefik.http.routers.user.rule=PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/roles`) || PathPrefix(`/api/v1/specialities`) || PathPrefix(`/docs`)"
      - "traefik.http.routers.user.entrypoints=web"
      - "traefik.http.routers.user.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.services.user.loadbalancer.server.port=3000"
      # The unauthenticated routes, sign-in and password recovery, get the stricter per-IP limit
      - "traefik.http.routers.user-auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/password-recoveries`)"
      - "traefik.http.routers.user-auth.entrypoints=web"
      - "traefik.http.routers.user-auth.middlewares=global-compress@docker,secure-headers@docker,auth-rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.user-auth.priority=10"
      - "traefik.http.routers.user-auth.service=user"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  telemetry:
    image: ghcr.io/ulasdnz/aimes-telemetry:${AIMES_VERSION:-dev}
    container_name: telemetry_app
    restart: unless-stopped
    logging: *logging
    environment:
      - MONGO_URI=${MONGO_URI_TELEMETRY:-mongodb://mongodb:27017/mes_telemetry?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - INTERNAL_API_PRODUCTION=${INTERNAL_API_PRODUCTION:-http://production:3002}
      - MQTT_URL=${MQTT_URL:-mqtt://mosquitto:1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-mes_service}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be set}
      # Outlives the broker's queue ceiling, so a longer outage ends with counted drops
      - MQTT_SESSION_EXPIRY_SECONDS=${MQTT_SESSION_EXPIRY_SECONDS:-86400}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.telemetry.rule=PathPrefix(`/api/v1/tags`) || PathPrefix(`/api/v1/tag-types`) || PathPrefix(`/api/v1/edge-devices`) || PathPrefix(`/api/v1/historian`) || PathPrefix(`/api/v1/discovery`)"
      - "traefik.http.routers.telemetry.entrypoints=web"
      - "traefik.http.routers.telemetry.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.telemetry.priority=20"
      - "traefik.http.services.telemetry.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  work-center:
    image: ghcr.io/ulasdnz/aimes-work-center:${AIMES_VERSION:-dev}
    container_name: work_center_app
    restart: unless-stopped
    logging: *logging
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/mes?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - INTERNAL_API_PRODUCTION=${INTERNAL_API_PRODUCTION:-http://production:3002}
      - PLANT_TIMEZONE=${PLANT_TIMEZONE:-Europe/Istanbul}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      # Work center routes — priority > 1 so they match before user-service catch-all
      - "traefik.http.routers.work-center.rule=PathPrefix(`/api/v1/work-centers`) || PathPrefix(`/api/v1/shifts`)"
      - "traefik.http.routers.work-center.entrypoints=web"
      - "traefik.http.routers.work-center.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.routers.work-center.priority=5"
      - "traefik.http.services.work-center.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  production:
    image: ghcr.io/ulasdnz/aimes-production:${AIMES_VERSION:-dev}
    container_name: production_app
    restart: unless-stopped
    logging: *logging
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/mes?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - INTERNAL_API_WORK_CENTER=${INTERNAL_API_WORK_CENTER:-http://work-center:3001}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.production.rule=PathPrefix(`/api/v1/uoms`) || PathPrefix(`/api/v1/product-categories`) || PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/product-standards`) || PathPrefix(`/api/v1/production-plans`) || PathPrefix(`/api/v1/job-orders`) || PathPrefix(`/api/v1/quantity-adjustments`) || PathPrefix(`/api/v1/scrap-entries`)"
      - "traefik.http.routers.production.entrypoints=web"
      - "traefik.http.routers.production.priority=5"
      - "traefik.http.routers.production.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.services.production.loadbalancer.server.port=3002"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  performance:
    image: ghcr.io/ulasdnz/aimes-performance:${AIMES_VERSION:-dev}
    container_name: performance_app
    restart: unless-stopped
    logging: *logging
    environment:
      - MONGO_URI=${MONGO_URI_PERFORMANCE:-mongodb://mongodb:27017/mes_performance?directConnection=true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
      - INTERNAL_API_WORK_CENTER=${INTERNAL_API_WORK_CENTER:-http://work-center:3001}
      - INTERNAL_API_PRODUCTION=${INTERNAL_API_PRODUCTION:-http://production:3002}
      - INTERNAL_API_TELEMETRY=${INTERNAL_API_TELEMETRY:-http://telemetry:3001}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.performance.rule=PathPrefix(`/api/v1/oee`) || PathPrefix(`/api/v1/reasons`) || PathPrefix(`/api/v1/planned-stops`) || PathPrefix(`/api/v1/planned-stop-templates`) || PathPrefix(`/api/v1/planned-stop-schedules`) || PathPrefix(`/api/v1/unplanned-stops`) || PathPrefix(`/api/v1/performance-policies`)"
      - "traefik.http.routers.performance.entrypoints=web"
      - "traefik.http.routers.performance.priority=5"
      - "traefik.http.routers.performance.middlewares=global-compress@docker,secure-headers@docker,rate-limit@docker,body-limit@docker"
      - "traefik.http.services.performance.loadbalancer.server.port=3004"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  realtime:
    image: ghcr.io/ulasdnz/aimes-realtime:${AIMES_VERSION:-dev}
    container_name: realtime_app
    restart: unless-stopped
    logging: *logging
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      - INTERNAL_API_USER=${INTERNAL_API_USER:-http://user:3000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mes_network"
      - "traefik.http.routers.realtime.rule=PathPrefix(`/socket.io`)"
      - "traefik.http.routers.realtime.entrypoints=web"
      - "traefik.http.routers.realtime.priority=10"
      - "traefik.http.services.realtime.loadbalancer.server.port=3003"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  loki:
    image: grafana/loki:3.4.1@sha256:1d0c5ddc7644b88956aa0bd775ad796d9635180258a225d6ab3552751d5e2a66
    container_name: loki
    restart: unless-stopped
    logging: *logging
    command: --config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - mes_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 300M

  alloy:
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    container_name: alloy
    restart: unless-stopped
    logging: *logging
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      # The image has neither wget nor curl; bash opens the connection itself
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          # Peaked at 69 MiB shipping a burst of about 6,000 lines
          memory: 128M

  grafana:
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    container_name: grafana
    restart: unless-stopped
    logging: *logging
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  mes_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  user_uploads:
  loki_data:
  grafana_data:
  alloy_data:
  mosquitto_data:
